appId: io.github.max2605.stratagemtrainer
productName: Stratagem Trainer
copyright: Copyright © 2026 Stratagem Trainer contributors
asar: true
npmRebuild: false
directories:
  output: build/desktop
files:
  - dist/**/*
  - desktop/**/*
  - package.json
  - '!node_modules/**/*'
  - '!**/*.test.cjs'
  - '!desktop/smoke-test.mjs'
  - '!**/*.map'
artifactName: Stratagem-Trainer-${version}-${os}-${arch}.${ext}
win:
  icon: desktop/icons/icon.ico
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  executableName: StratagemTrainer
  signExecutable: false
portable:
  artifactName: Stratagem-Trainer-${version}-windows-${arch}-portable.exe
nsis:
  artifactName: Stratagem-Trainer-${version}-windows-${arch}-setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  icon: desktop/icons/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Game
  executableName: stratagem-trainer
  synopsis: Offline stratagem input trainer
mac:
  icon: desktop/icons/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.games
  identity: null
  notarize: false
publish: null
