name: Build and verify all platforms

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test desktop/https-download.test.cjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows
            args: --win --x64
            smoke: build/desktop/win-unpacked/StratagemTrainer.exe
          - runner: ubuntu-24.04
            target: linux
            args: --linux --x64
            smoke: build/desktop/linux-unpacked/stratagem-trainer
          - runner: macos-26
            target: macOS
            args: --mac --x64 --arm64
            smoke: build/desktop/mac-arm64/Stratagem Trainer.app/Contents/MacOS/Stratagem Trainer
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm dist:desktop ${{ matrix.args }} --publish never
      - name: Verify packaged desktop runtime
        if: matrix.target != 'linux'
        run: node desktop/smoke-test.mjs "${{ matrix.smoke }}"
      - name: Verify packaged Linux runtime in virtual display
        if: matrix.target == 'linux'
        run: |
          pnpm exec playwright install-deps chromium
          xvfb-run --auto-servernum node desktop/smoke-test.mjs "${{ matrix.smoke }}" --no-sandbox
      - run: node scripts/stage-platforms.mjs --platform ${{ matrix.target }}
      - run: python scripts/platform-archive.py ${{ matrix.target }} release/Stratagem-Trainer-${{ matrix.target }}-complete.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            release/*.zip
            ${{ matrix.target }}/application/*.exe
            ${{ matrix.target }}/application/*.AppImage
            ${{ matrix.target }}/application/*.tar.gz
            ${{ matrix.target }}/application/*.dmg
            ${{ matrix.target }}/application/*-mac-*.zip
          if-no-files-found: error
          retention-days: 30

  android:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/platform-prepare.mjs android
      - name: Build installable debug APK
        working-directory: android/sourcecode/native
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - run: node scripts/stage-platforms.mjs --platform android --artifact android/sourcecode/native/app/build/outputs/apk/debug/app-debug.apk
      - run: python scripts/platform-archive.py android release/Stratagem-Trainer-android-complete.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            release/*.zip
            android/application/*.apk
          if-no-files-found: error
          retention-days: 30

  iphone:
    needs: verify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: xcodebuild -version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/platform-prepare.mjs ios
      - name: Build simulator app and unsigned device archive
        run: bash scripts/platform-ios.sh
      - run: python scripts/platform-archive.py iphone release/Stratagem-Trainer-iphone-complete.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-iphone
          path: |
            release/*.zip
            iphone/application/*.zip
            iphone/application/*.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, desktop, android, iphone]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded
      - name: Gather native downloads and full platform archives
        run: |
          mkdir -p release
          find downloaded -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.zip' -o -name '*.apk' -o -name '*.ipa' \) -exec cp {} release/ \;
          node scripts/checksums.mjs release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Stratagem Trainer $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release/* --clobber
